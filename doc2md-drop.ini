[defaults]
# This file is loaded by doc2md-drop.exe when files are dropped onto it.
# Values here are inserted before dropped/selected file paths.

# Common output defaults
output = output_data
output_format = adoc
pdf_engine = auto

# Set true when you want these flags enabled by default.
overwrite = false
recursive = false
no_front_matter = false
no_sha256 = false
include_source_path = false
no_images = false

# Pandoc defaults. Pandoc itself must be installed separately.
# Use "auto" for distribution so each user's standard install path is detected.
use_pandoc = true
pandoc_bin = auto

# PDF/OCR defaults. Tesseract itself must be installed separately for OCR.
pdf_force_page_headings = false
pdf_ocr = true
pdf_ocr_strategy = fallback
pdf_ocr_lang = jpn+jpn_vert
pdf_ocr_dpi = 300
pdf_ocr_psm = 6
pdf_ocr_oem = 3
pdf_ocr_tesseract = auto
pdf_ocr_tessdata = auto

# Excel defaults
excel_max_rows = 500
excel_max_cols = 50
excel_cell_max_chars = 200

# Word defaults
word_heading_style = ATX
word_strip_empty_lines = false
word_keep_empty_lines = false

# For options not listed above, add raw CLI arguments here.
# One option group per line is easiest to read.
default_args =
    # --pdf-max-pages 10
    # --json-summary summary.json
